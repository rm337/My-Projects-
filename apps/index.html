<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluid Systems | Apps & Programs</title>
<meta name="description" content="Robert Marleton's live gallery of Fluid Systems apps, programs, gadgets, and creative machines.">
<style>
:root{--blue:#0174F3;--bg:#03070D;--panel:#07111F;--cream:#F3EBD8;--cyan:#39D9FF;--muted:#92A7BA;--line:rgba(57,217,255,.18)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(1,116,243,.28),transparent 38%),var(--bg);color:var(--cream);font:16px/1.5 Inter,system-ui,sans-serif;min-height:100vh}main{width:min(1180px,calc(100% - 32px));margin:auto;padding:56px 0 80px}.eyebrow{color:var(--cyan);font-size:.74rem;letter-spacing:.2em;font-weight:900}.hero{display:flex;justify-content:space-between;gap:28px;align-items:end;margin-bottom:34px}h1{font-size:clamp(3rem,8vw,7rem);line-height:.88;letter-spacing:-.06em;margin:12px 0}.lede{max-width:650px;color:#c7d4df;font-size:1.1rem}.count{font-weight:900;color:var(--cyan);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{display:flex;flex-direction:column;min-height:240px;padding:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(1,116,243,.10),rgba(7,17,31,.92));text-decoration:none;color:inherit;transition:.18s}.card:hover{transform:translateY(-4px);border-color:rgba(57,217,255,.55);box-shadow:0 22px 60px rgba(0,0,0,.34)}.tag{font-size:.7rem;letter-spacing:.14em;color:var(--cyan);font-weight:900;text-transform:uppercase}.card h2{font-size:1.55rem;line-height:1.05;margin:18px 0 10px}.card p{color:#b8c8d5;margin:0 0 22px}.launch{margin-top:auto;color:white;font-weight:900}.empty{padding:30px;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}footer{margin-top:36px;color:var(--muted);font-size:.85rem}.pulse{display:inline-block;width:9px;height:9px;background:var(--blue);border-radius:50%;box-shadow:0 0 18px var(--blue);margin-right:7px}@media(max-width:700px){.hero{display:block}.count{margin-top:16px;display:block}}
</style>
</head>
<body><main>
<section class="hero"><div><div class="eyebrow">FLUID SYSTEMS / LIVE BUILD GALLERY</div><h1>Apps &<br>Programs</h1><p class="lede">Every deployable build in the repository is indexed here automatically. New machine enters the shop, new card appears in the gallery.</p></div><div class="count" id="count"><span class="pulse"></span>SCANNING BUILDS</div></section>
<section class="grid" id="grid"><div class="empty">Loading the Fluid Systems build registry…</div></section>
<footer>A Little Ink. A Lot of Soul. The Color Blue.</footer>
</main>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
fetch('./apps-manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('registry');return r.json()}).then(data=>{const apps=data.apps||[];document.querySelector('#count').innerHTML=`<span class="pulse"></span>${apps.length} LIVE BUILD${apps.length===1?'':'S'}`;document.querySelector('#grid').innerHTML=apps.length?apps.map(a=>`<a class="card" href="${esc(a.href)}"><span class="tag">${esc(a.type||'APP / PROGRAM')}</span><h2>${esc(a.title||a.slug)}</h2><p>${esc(a.description||'Fluid Systems build')}</p><span class="launch">OPEN BUILD →</span></a>`).join(''):'<div class="empty">No deployable builds found yet.</div>'}).catch(()=>{document.querySelector('#grid').innerHTML='<div class="empty">Build registry is being generated by the deployment pipeline.</div>';document.querySelector('#count').textContent='REGISTRY PENDING'});
</script></body></html>
